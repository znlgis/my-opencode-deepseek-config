<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>DSH Video Studio · Canvas2D 逐帧渲染模板（v0.8.0）</title>
  <!-- 本地样式与脚本：不引 CDN、不连任何网络 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 画布默认 1920x1080，必须与 webengine.py 的 viewport 一致，截图才是 1:1 像素。
       v0.8.0：webengine.open_page(style=...) 注入 window.__STYLE__.canvas 时，engine.js 会把
       canvas 宽高与 CSS 尺寸改成注入值（只允许 16:9 横屏或 9:16 竖屏，与 webengine 校验一致）；
       没有 __STYLE__ 时就是下面这组（1920x1080 写死在 index.html / style.css 里，
       所以 style=None 时请用横屏；竖屏必须注入 canvas）。 -->
  <canvas id="stage" width="1920" height="1080"></canvas>

  <script src="engine.js"></script>
  <!-- 页面契约（references/web-engine.md §3）：DURATION 必须等于成片秒数。
       模板默认由场景表自动推导（film.js 的 resolveDuration）；
       要锁死就取消下面这行注释并改成 timeline.json 的 total：
  <script>window.WINDOW_DURATION = 12.0;</script>
  -->
  <script src="film.js"></script>
  <script src="qa_text.js"></script>
  <script>
    // 场景与文字登记都建好、字体度量稳定后才把 window.ready 置 true
    // 为什么要 catch：boot() 是 async，裸调用一旦在 renderFrame(0)/字体 await 处抛错就是
    // unhandled rejection —— 页面看着"在加载"，window.ready 永远不置 true，webengine 只能
    // 干等到 ready 超时（open_page 默认 300 s）。把错误留在 window.__BOOT_ERROR__（字符串，
    // 含 stack）并打 console.error，渲染端与人工排查都能立刻看到可读原因。
    // 必须先判空：engine.js 自己加载失败（404/语法错）时 window.FK 是 undefined，
    // 裸调 window.FK.boot() 是同步 TypeError，下面的 .catch 根本挂不上，
    // 于是 __BOOT_ERROR__ 永远写不进去，渲染端只能干等到 ready 超时。
    if (!window.FK || typeof window.FK.boot !== "function") {
      window.__BOOT_ERROR__ = "[video-studio] engine.js 没有加载出 window.FK.boot()"
        + "（检查 assets/web/engine.js 是否存在/是否被改坏）";
      console.error(window.__BOOT_ERROR__);
    } else {
      window.FK.boot().catch(function (e) {
        window.__BOOT_ERROR__ = (e && e.stack) ? String(e.stack) : String(e);
        console.error('[video-studio] boot() 失败：', e);
      });
    }
  </script>
</body>
</html>
